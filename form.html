<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        .form-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 8px;
            background-color: rgb(135, 222, 154);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input.invalid {
            border-color: #d9534f;
            background-color: #fff0f0;
        }

        .error-message {
            color: #d1425c;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #338b2b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #4a6e20;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form id="registrationForm" action="/Registration" method="POST" novalidate>
            <div class="form-group">
                <label for="username">Name</label>
                <input type="text" id="username" name="username" placeholder="Enter your name">
                <span class="error-message" id="usernameError">Name is required.</span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
                <span class="error-message" id="emailError">Please enter a valid email address.</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters">
                <span class="error-message" id="passwordError">Password must be at least 6 characters long.</span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Re-Pass</label>
                <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter your password">
                <span class="error-message" id="confirmPasswordError">Passwords do not match.</span>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile</label>
                <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number">
                <span class="error-message" id="mobileError">Enter a valid 10-digit mobile number.</span>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const mobile = document.getElementById('mobile');

        // Regex helpers
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const mobileRegex = /^[0-9]{10}$/;

        function showError(input, errorElement, message) {
            input.classList.add('invalid');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function clearError(input, errorElement) {
            input.classList.remove('invalid');
            errorElement.style.display = 'none';
        }

        function validateForm() {
            let isValid = true;
            if (username.value.trim() === '') {
                showError(username, document.getElementById('usernameError'), 'Name is required.');
                isValid = false;
            } else {
                clearError(username, document.getElementById('usernameError'));
            }

            if (!emailRegex.test(email.value.trim())) {
                showError(email, document.getElementById('emailError'), 'Please enter a valid email address.');
                isValid = false;
            } else {
                clearError(email, document.getElementById('emailError'));
            }
            if (password.value.length < 6) {
                showError(password, document.getElementById('passwordError'), 'Password must be at least 6 characters.');
                isValid = false;
            } else {
                clearError(password, document.getElementById('passwordError'));
            }

            if (confirmPassword.value === '' || confirmPassword.value !== password.value) {
                showError(confirmPassword, document.getElementById('confirmPasswordError'), 'Passwords do not match.');
                isValid = false;
            } else {
                clearError(confirmPassword, document.getElementById('confirmPasswordError'));
            }
            if (!mobileRegex.test(mobile.value.trim())) {
                showError(mobile, document.getElementById('mobileError'), 'Enter a valid 10-digit mobile number.');
                isValid = false;
            } else {
                clearError(mobile, document.getElementById('mobileError'));
            }

            return isValid;
        }
        form.addEventListener('submit', function (event) {
            if (!validateForm()) {
                event.preventDefault(); // Stop form from submitting if invalid
            } else {
                alert('Form submitted successfully!');
            }
        });
    </script>
</body>
</html>
